<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Works In Progress</title>
  <!-- version 2 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Josefin Sans', sans-serif;
      background: #b7008c;
      padding: 30px;
      margin: 0;
      color: white;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .idea-item {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
}
.idea-item:hover {
  background: #ffe0c7;

}

/* Hidden details container */
.idea-details {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
  font-size: 15px;
  padding-left: 10px;
  color: #444;
}

.idea-details ul {
  padding-left: 20px;
  margin: 5px 0;
}

.idea-details li {
  margin-bottom: 4px;
}

.idea-details:hover {
  max-height: 500px; /* or bigger if needed */
}


  </style>
</head>

<body>

  <h1>Your Ideas</h1>

  <div class="idea-list" id="ideaList">
    <p>Loading ideas...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLfSyJTrfKJ11y0-OD-tqce51hAhB9ubk",
      authDomain: "artportfolio-7fb57.firebaseapp.com",
      projectId: "artportfolio-7fb57",
      storageBucket: "artportfolio-7fb57.firebasestorage.app",
      messagingSenderId: "221364362709",
      appId: "1:221364362709:web:4ad550bd8970302ef0715c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadIdeas() {
      const list = document.getElementById("ideaList");
      list.innerHTML = "<p>Loading ideas...</p>";

      const querySnapshot = await getDocs(collection(db, "ideas"));

      list.innerHTML = ""; // clear loading text

      querySnapshot.forEach(doc => {
  const data = doc.data();

  const item = document.createElement("div");
  item.className = "idea-item";

  // Clickable title → opens idea.html?id=DOC_ID
  const title = document.createElement("a");
  title.textContent = data.title;
  title.href = `wipproject.html?id=${doc.id}`;
  title.style.fontWeight = "600";
  title.style.textDecoration = "none";
  title.style.color = "inherit";

  // Hover details
  const details = document.createElement("div");
  details.className = "idea-details";
  details.textContent = [
  data.type ? `Type: ${data.type}` : null,
  data.material ? `Material: ${data.material}` : null,
  data.difficultly ? `Difficulty: ${data.difficultly}` : null,
  data.priority ? `Priority: ${data.priority}` : null
  ].filter(Boolean).join(" • ") || "(no details yet)";


  item.appendChild(title);
  item.appendChild(details);
  list.appendChild(item);
});

item.addEventListener("mouseenter", () => {
  item.classList.add("expanded");
});

item.addEventListener("mouseleave", () => {
  item.classList.remove("expanded");
});


      if (list.innerHTML.trim() === "") {
        list.innerHTML = "<p>No ideas yet.</p>";
      }
    }

    loadIdeas();
  </script>

</body>
</html>
