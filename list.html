<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <a href="index.html" class="nav-btn">Home!</a>
  <title>Works In Progress</title>
  
  <!-- version 5 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Josefin Sans', sans-serif;
      background: #b7008c;
      padding: 30px;
      margin: 0;
      color: white;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .idea-item {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      display:grid;
      grid-template-columns: 3fr 1fr 1fr;
      position: relative;
}
    .idea-item:hover {
      background: #fe8e3d;

    }

      .nav-btn {
      background: #fe8e3d;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      }

    .nav-btn:hover {
      background: #e6762d;
    }

    /* Hidden details container */
    .idea-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
      font-size: 15px;
      margin: 8px;
      padding-left: 10px;
      color: #ffffff;mar
    }

    .idea-details ul {
      padding-left: 20px;
      margin: 5px 0;
    }

    .idea-details li {
      margin-bottom: 4px;
    }


    .idea-item.expanded .idea-details.expanded {
      max-height: 500px; /* or bigger if needed */
    }

      #filters {
    display: flex;
    gap: 15px;
    padding: 15px;
    background: #fe8e3d;
    color: white;
    border-radius: 10px;
    margin: 20px auto;
    width: fit-content;
  }
#filters select {
  padding: 8px 12px;
  border-radius: 8px;
  background: #fe8e3d;   /* orange background */
  color: white;           /* white text */
  border: 2px solid white;
  font-size: 16px;
  cursor: pointer;
}

#filters select {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background: #fe8e3d url("data:image/svg+xml;utf8,<svg fill='white' height='20' width='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'><polygon points='0,0 20,0 10,10'/></svg>") no-repeat right 10px center;
  background-size: 12px;
}




  </style>
</head>

<body>

  <h1>Your Ideas</h1>

  <div id="filters">
    <select id="filterDifficulty">
      <option value="">All Difficulties</option>
      <option value="Easy">Easy</option>
      <option value="Medium">Medium</option>
      <option value="Hard">Hard</option>
    </select>

    <select id="filterType">
      <option value="">All Types</option>
      <option value="Acrylic Painting">Acrylic Painting</option>
      <option value="Beading">Beading</option>
      <option value="Candle Making">Candle Making</option>
      <option value="Clay">Clay</option>
      <option value="Crocheting">Crocheting</option>
      <option value="Digital Art">Digital Art</option>
      <option value="Embroidering">Embroidering</option>
      <option value="Oil Painting">Oil Painting</option>
      <option value="Resin">Resin</option>
      <option value="Sewing">Sewing</option>
      <option value="Watercolor">Watercolor</option>
      <option value="Website Building">Website Building</option>
      <option value="Woodworking">Woodworking</option>
      <option value="Other">Other</option>
      <!-- Add your actual types here -->
    </select>

    <select id="filterPriority">
      <option value="">All Priorities</option>
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>
  </div>


  <div class="idea-list" id="ideaList">
    <p>Loading ideas...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLfSyJTrfKJ11y0-OD-tqce51hAhB9ubk",
      authDomain: "artportfolio-7fb57.firebaseapp.com",
      projectId: "artportfolio-7fb57",
      storageBucket: "artportfolio-7fb57.firebasestorage.app",
      messagingSenderId: "221364362709",
      appId: "1:221364362709:web:4ad550bd8970302ef0715c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

        async function loadIdeas() {
      const list = document.getElementById("ideaList");
      list.innerHTML = "<p>Loading ideas...</p>";

      // Load ALL ideas
      const snapshot = await getDocs(collection(db, "ideas"));
      const allIdeas = [];

      snapshot.forEach(doc => {
        const data = doc.data();
        allIdeas.push({ id: doc.id, ...data });
      });

      list.innerHTML = ""; // clear loading text

      function renderFiltered() {
        list.innerHTML = "";

        const diffFilter = document.getElementById("filterDifficulty").value;
        const typeFilter = document.getElementById("filterType").value;
        const priorityFilter = document.getElementById("filterPriority").value;

        const filtered = allIdeas.filter(idea => {
          if (idea.status === "Finished") return false;
          if (diffFilter && idea.difficulty !== diffFilter) return false;
          if (typeFilter && (!idea.type || !idea.type.includes(typeFilter))) return false;
          if (priorityFilter && idea.priority !== priorityFilter) return false;
          return true;
        });

        if (filtered.length === 0) {
          list.innerHTML = "<p>No in-progress ideas.</p>";
          return;
        }

        filtered.forEach(idea => {
          const item = document.createElement("div");
          item.className = "idea-item";

          const title = document.createElement("a");
          title.textContent = idea.title;
          title.href = `wipproject.html?id=${idea.id}`;
          title.style.fontWeight = "600";
          title.style.textDecoration = "none";
          title.style.color = "inherit";

          const details = document.createElement("div");
          details.className = "idea-details";
          details.innerHTML = [
            idea.type ? `<li>Type: ${idea.type.join(", ")}</li>` : null,
            idea.materials ? `<li>Materials: ${idea.materials}</li>` : null,
            idea.difficulty ? `<li>Difficulty: ${idea.difficulty}</li>` : null,
            idea.priority ? `<li>Priority: ${idea.priority}</li>` : null
          ].filter(Boolean).join(" ");

          item.appendChild(title);
          item.appendChild(details);
          list.appendChild(item);

          // Hover behavior
          item.addEventListener("mouseenter", () => {
            item.classList.add("expanded");
            details.classList.add("expanded");
          });

          item.addEventListener("mouseleave", () => {
            item.classList.remove("expanded");
            details.classList.remove("expanded");
          });
        });
      }

      // Re-render when filters change
      document.getElementById("filterDifficulty").addEventListener("change", renderFiltered);
      document.getElementById("filterType").addEventListener("change", renderFiltered);
      document.getElementById("filterPriority").addEventListener("change", renderFiltered);

      // Initial render
      renderFiltered();
    }

    // Call the function
    loadIdeas();

</script>


</body>
</html>
