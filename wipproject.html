<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Idea Details</title>

  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Josefin Sans', sans-serif;
      background: #b7008c;
      padding: 30px;
      margin: 0;
      color: white;
    }
    ul {
  margin-top: 5px;
  margin-bottom: 15px;
  padding-left: 20px;
  color: #444;
}

ul li {
  margin-bottom: 6px;
}

.step-card {
  background: #f7f7f7;
  border-left: 6px solid #fe8e3d;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
  color: #444;
}

.step-card h3 {
  margin: 0 0 8px 0;
  color: #b7008c;
}

.step-meta {
  font-size: 14px;
  margin-top: 6px;
  color: #666;
}

.total-time-badge {
  display: inline-block;
  background: #fe8e3d;
  color: white;
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: 600;
  margin-bottom: 15px;
}
.action-btn {
  background: #b7008c;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  margin-right: 10px;
  font-size: 15px;
}

.action-btn:hover {
  background: #9a0075;
}

.action-btn.delete {
  background: #ff0015;
}

.action-btn.delete:hover {
  background: #ff0015;
}


    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      color: #b7008c;
      padding: 25px;
      border-radius: 12px;
    }

    a {
      color: #b7008c;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="container">
    <a href="list.html">← Back to list</a>
    <h1 id="title">Loading...</h1>
    <div id="totalTime" class="total-time-badge" style="display:none;"></div>
    <div style="margin: 15px 0;">
  <button id="editBtn" class="action-btn">Edit</button>
  <button id="deleteBtn" class="action-btn delete">Delete</button>
</div>

    <p><strong>Type:</strong></p>
<ul id="type"></ul>

<p><strong>Materials:</strong></p>
<p id="materials"></p>

<p><strong>Difficulty:</strong> <span id="difficulty"></span></p>

<p><strong>Priority:</strong> <span id="priority"></span></p>

<p><strong>Steps:</strong></p>
<ul id="steps"></ul>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLfSyJTrfKJ11y0-OD-tqce51hAhB9ubk",
      authDomain: "artportfolio-7fb57.firebaseapp.com",
      projectId: "artportfolio-7fb57",
      storageBucket: "artportfolio-7fb57.firebasestorage.app",
      messagingSenderId: "221364362709",
      appId: "1:221364362709:web:4ad550bd8970302ef0715c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadIdea() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      const docRef = doc(db, "ideas", id);
      const docSnap = await getDoc(docRef);

      if (!docSnap.exists()) {
        document.getElementById("title").textContent = "Idea not found";
        return;
      }

      const data = docSnap.data();

      document.getElementById("title").textContent = data.title;

// --- TYPE ---
const typeList = document.getElementById("type");
typeList.innerHTML = "";
data.type.forEach(t => {
  const li = document.createElement("li");
  li.textContent = t;
  typeList.appendChild(li);
});

// --- MATERIALS ---
document.getElementById("materials").textContent = data.materials;

// --- DIFFICULTY + PRIORITY ---
document.getElementById("difficulty").textContent = data.difficulty;
document.getElementById("priority").textContent = data.priority;

// --- STEPS AS CARDS ---
const stepsList = document.getElementById("steps");
stepsList.innerHTML = "";

let totalMinutes = 0;

data.steps.forEach((step, index) => {
  const card = document.createElement("div");
  card.className = "step-card";

  // Extract minutes from "10 min" or "1 hr 20 min"
  const timeText = step.time.toLowerCase();
  let minutes = 0;

  const hrMatch = timeText.match(/(\d+)\s*hr/);
  const minMatch = timeText.match(/(\d+)\s*min/);

  if (hrMatch) minutes += parseInt(hrMatch[1]) * 60;
  if (minMatch) minutes += parseInt(minMatch[1]);

  totalMinutes += minutes;

  card.innerHTML = `
    <h3>Step ${index + 1}: ${step.title}</h3>
    <div class="step-meta"><strong>Materials:</strong> ${step.materials}</div>
    <div class="step-meta"><strong>Difficulty:</strong> ${step.difficulty}</div>
    <div class="step-meta"><strong>Time:</strong> ${step.time}</div>
  `;

  stepsList.appendChild(card);
});

// --- TOTAL TIME BADGE ---
if (totalMinutes > 0) {
  const hours = Math.floor(totalMinutes / 60);
  const mins = totalMinutes % 60;

  let display = "";
  if (hours > 0) display += `${hours} hr `;
  if (mins > 0) display += `${mins} min`;

  const badge = document.getElementById("totalTime");
  badge.textContent = `Total Time: ${display}`;
  badge.style.display = "inline-block";
});


import { deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

document.getElementById("deleteBtn").addEventListener("click", async () => {
  if (confirm("Delete this idea?")) {
    await deleteDoc(doc(db, "ideas", id));
    window.location.href = "list.html";
  }

  document.getElementById("editBtn").addEventListener("click", () => {
  window.location.href = `newidea.html?id=${id}`;
});

});

    }

    loadIdea();
  </script>

</body>
</html>
