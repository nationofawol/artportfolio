<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Works In Progress</title>
  
  <!-- version 5 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Josefin Sans', sans-serif;
      background: #b7008c;
      padding: 30px;
      margin: 0;
      color: white;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .idea-item {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      display:grid;
      grid-template-columns: 3fr 1fr 1fr;
      position: relative;
}
    .idea-item:hover {
      background: #fe8e3d;

    }

      .nav-btn {
      background: #fe8e3d;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      }

    .nav-btn:hover {
      background: #e6762d;
    }

    /* Hidden details container */
    .idea-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
      font-size: 15px;
      margin: 8px;
      padding-left: 10px;
      color: #ffffff;
    }

    .idea-details ul {
      padding-left: 20px;
      margin: 5px 0;
    }

    .idea-details li {
      margin-bottom: 4px;
    }


    .idea-item.expanded .idea-details.expanded {
      max-height: 500px; /* or bigger if needed */
    }

      #filters {
    display: flex;
    gap: 15px;
    padding: 15px;
    background: #fe8e3d;
    color: white;
    border-radius: 10px;
    margin: 20px auto;
    width: fit-content;
  }
#filters select {
  padding: 8px 12px;
  border-radius: 8px;
  background: #fe8e3d;   /* orange background */
  color: white;           /* white text */
  border: 2px solid white;
  font-size: 16px;
  cursor: pointer;
}

  </style>
</head>

<body>
<a href="index.html" class="nav-btn">Home!</a>
  <h1>"What Should We Do?"</h1>

    <div id="filters">
    <select id="filterType">
      <option value="">All Types</option>
      <option value="Acrylic Painting">Acrylic Painting</option>
      <option value="Beading">Beading</option>
      <option value="Candle Making">Candle Making</option>
      <option value="Clay">Clay</option>
      <option value="Crocheting">Crocheting</option>
      <option value="Digital Art">Digital Art</option>
      <option value="Embroidering">Embroidering</option>
      <option value="Oil Painting">Oil Painting</option>
      <option value="Resin">Resin</option>
      <option value="Sewing">Sewing</option>
      <option value="Watercolor">Watercolor</option>
      <option value="Website Building">Website Building</option>
      <option value="Woodworking">Woodworking</option>
      <option value="Other">Other</option>
      <!-- Add your actual types here -->
    </select>

    <select id="filterPriority">
      <option value="">All Priorities</option>
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>
  </div>


  <div class="idea-list" id="ideaList">
    <p>Loading ideas...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query}
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLfSyJTrfKJ11y0-OD-tqce51hAhB9ubk",
      authDomain: "artportfolio-7fb57.firebaseapp.com",
      projectId: "artportfolio-7fb57",
      storageBucket: "artportfolio-7fb57.firebasestorage.app",
      messagingSenderId: "221364362709",
      appId: "1:221364362709:web:4ad550bd8970302ef0715c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

        async function loadIdeas() {
      const list = document.getElementById("ideaList");
      list.innerHTML = "<p>Loading ideas...</p>";

            // Load ALL ideas
        const q = query(collection(db, "ideas"));
        const snapshot = await getDocs(q);

        const allProjects = [];
        snapshot.forEach(doc => {
        allProjects.push({ id: doc.id, ...doc.data() });
        });

        // Remove finished ones
        const notFinished = allProjects.filter(p => p.status !== "Finished");

        // Filter by step status AND difficulty
        const filteredProjects = notFinished.filter(p =>
        p.steps?.some(step =>
            step.status === "Not Started" &&
            step.difficulty === "Easy"
        )
        );
        // Extract ONLY the matching steps from each project
        const stepItems = [];

        filteredProjects.forEach(project => {
        project.steps.forEach(step => {
            if ((step.status === "Not Started" || step.status === "In progress") && step.difficulty === "Easy") {
            stepItems.push({
                projectId: project.id,
                projectTitle: project.title,
                stepTitle: step.title,
                stepMaterials: step.materials,
                stepDifficulty: step.difficulty,
                stepStatus: step.status
            });
            }
        });
        });


      list.innerHTML = ""; // clear loading text

            function renderFiltered() {
        list.innerHTML = "";

        const typeFilter = document.getElementById("filterType").value;
        const priorityFilter = document.getElementById("filterPriority").value;

        // Start with step-level items
        let filtered = stepItems;

        // Filter by project type
        if (typeFilter) {
            filtered = filtered.filter(item =>
            filteredProjects
                .find(p => p.id === item.projectId)
                ?.type?.includes(typeFilter)
            );
        }

        // Filter by project priority
        if (priorityFilter) {
            filtered = filtered.filter(item =>
            filteredProjects
                .find(p => p.id === item.projectId)
                ?.priority === priorityFilter
            );
        }

        if (filtered.length === 0) {
            list.innerHTML = "<p>No matching steps.</p>";
            return;
        }

        filtered.forEach(step => {
            const item = document.createElement("div");
            item.className = "idea-item";

            item.innerHTML = `
            <div><strong>${step.stepTitle}</strong></div>
            <div>${step.stepDifficulty}</div>
            <div>${step.stepStatus}</div>
            `;

            const details = document.createElement("div");
            details.className = "idea-details";
            details.innerHTML = `
            <li><strong>Project:</strong> ${step.projectTitle}</li>
            ${step.stepMaterials ? `<li><strong>Materials:</strong> ${step.stepMaterials}</li>` : ""}
            `;

            item.appendChild(details);
            list.appendChild(item);

            // Hover behavior
            item.addEventListener("mouseenter", () => {
            item.classList.add("expanded");
            details.classList.add("expanded");
            });

            item.addEventListener("mouseleave", () => {
            item.classList.remove("expanded");
            details.classList.remove("expanded");
            });

            // Click to open project
            item.addEventListener("click", () => {
            window.location.href = `wipproject.html?id=${step.projectId}`;
            });
        });
        }



      // Re-render when filters change
      document.getElementById("filterType").addEventListener("change", renderFiltered);
      document.getElementById("filterPriority").addEventListener("change", renderFiltered);

      // Initial render
      renderFiltered();
    }

    // Call the function
    loadIdeas();

</script>


</body>
</html>
