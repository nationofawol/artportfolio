<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <a href="../index.html" class="nav-btn">Home!</a>
  <title>Reminisce</title>
  <!-- version 1 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Josefin Sans', sans-serif;
      background: #b7008c;
      color: #ffffff;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
      font-size: 40px;
      color: #ffffff;
    }

    /* GRID */
    #galleryGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* CARD */
    .project-card {
      position: relative;
      background: white;
      border-radius: 12px;
      color:#b7008c;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .project-card:hover {
      transform: scale(1.03);
    }

    /* THUMBNAIL */
    .project-thumb {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    /* TITLE */
    .project-info {
      padding: 12px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      background: #fff;
    }

    /* HOVER OVERLAY */
    .project-hover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fe8e3d;
      color: white;
      opacity: 0;
      padding: 10px;
      transition: opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
      text-wrap: balance;
      font-size: 16px;
      line-height: 1.4;
    }

    .project-card:hover .project-hover {
      opacity: 1;
    }


      #filters {
    display: flex;
    gap: 15px;
    padding: 15px;
    background: #fe8e3d;
    border-radius: 10px;
    margin: 20px auto;
    width: fit-content;
    }

    #filters select {
    padding: 8px 12px;
    border-radius: 8px;
    background: #fe8e3d;
    color: white;
    border: 2px solid white;
    font-size: 16px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    }


     .nav-btn {
      background: #fe8e3d;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      }

    .nav-btn:hover {
      background: #e6762d;
    }

    .top-nav {
  width: 100%;
  text-align: center;
  margin-bottom: 20px;
}

  </style>
</head>

<body>

  <h1>Reminisce</h1>

  <div id="filters">
  <select id="filterDifficulty">
    <option value="">All Difficulties</option>
    <option value="Easy">Easy</option>
    <option value="Medium">Medium</option>
    <option value="Hard">Hard</option>
  </select>

  <select id="filterType">
    <option value="">All Types</option>
    <option value="Acrylic Painting">Acrylic Painting</option>
    <option value="Beading">Beading</option>
    <option value="Candle Making">Candle Making</option>
    <option value="Clay">Clay</option>
    <option value="Crocheting">Crocheting</option>
    <option value="Digital Art">Digital Art</option>
    <option value="Embroidering">Embroidering</option>
    <option value="Oil Painting">Oil Painting</option>
    <option value="Resin">Resin</option>
    <option value="Sewing">Sewing</option>
    <option value="Watercolor">Watercolor</option>
    <option value="Website Building">Website Building</option>
    <option value="Woodworking">Woodworking</option>
    <option value="Other">Other</option>
  </select>

</div>


  <div id="galleryGrid"></div>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, where }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCLfSyJTrfKJ11y0-OD-tqce51hAhB9ubk",
    authDomain: "artportfolio-7fb57.firebaseapp.com",
    projectId: "artportfolio-7fb57",
    storageBucket: "artportfolio-7fb57.firebasestorage.app",
    messagingSenderId: "221364362709",
    appId: "1:221364362709:web:4ad550bd8970302ef0715c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadGallery() {
  const gallery = document.getElementById("galleryGrid");

  // Load only finished projects
  const q = query(
    collection(db, "ideas"),
    where("status", "==", "Finished")
  );

  const snapshot = await getDocs(q);
  const allProjects = [];

  snapshot.forEach(doc => {
    allProjects.push({ id: doc.id, ...doc.data() });
  });

  function renderFiltered() {
    gallery.innerHTML = "";

    const diffFilter = document.getElementById("filterDifficulty").value;
    const typeFilter = document.getElementById("filterType").value;

    const filtered = allProjects.filter(p => {
      if (diffFilter && p.difficulty !== diffFilter) return false;
      if (typeFilter && (!p.type || !p.type.includes(typeFilter))) return false;
      return true;
    });

        filtered.forEach(data => {
      const thumb = data.photos?.[0] || "https://via.placeholder.com/300x200?text=No+Image";

      const card = document.createElement("div");
      card.className = "project-card";

      // Make the entire card clickable
      card.addEventListener("click", () => {
        window.location.href = `../archived.html?id=${data.id}`;
      });

      card.innerHTML = `
        <img class="project-thumb" src="${thumb}">
        <div class="project-info">${data.title}</div>

        <div class="project-hover">
          <div><strong>Type:</strong> ${data.type?.join(", ") || "N/A"}</div>
          <div><strong>Materials:</strong> ${data.materials || "N/A"}</div>
          <div><strong>Difficulty:</strong> ${data.difficulty || "N/A"}</div>
        </div>
      `;

      gallery.appendChild(card);
    });

    if (filtered.length === 0) {
      gallery.innerHTML = `<p style="text-align:center;">No finished projects match your filters.</p>`;
    }
  }

  // Filter listeners
  document.getElementById("filterDifficulty").addEventListener("change", renderFiltered);
  document.getElementById("filterType").addEventListener("change", renderFiltered);

  // Initial render
  renderFiltered();
}

loadGallery();

</script>


</body>
</html>
