<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reminisce</title>

  <style>
    body {
      margin: 0;
      font-family: "Josefin Sans", sans-serif;
      background: #f7f2f8;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
      font-size: 40px;
      color: #b7008c;
    }

    /* GRID */
    #galleryGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* CARD */
    .project-card {
      position: relative;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .project-card:hover {
      transform: scale(1.03);
    }

    /* THUMBNAIL */
    .project-thumb {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    /* TITLE */
    .project-info {
      padding: 12px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      background: #fff;
    }

    /* HOVER OVERLAY */
    .project-hover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      color: white;
      opacity: 0;
      padding: 20px;
      transition: opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      font-size: 16px;
      line-height: 1.4;
    }

    .project-card:hover .project-hover {
      opacity: 1;
    }
  </style>
</head>

<body>

  <h1>Reminisce</h1>

  <div id="galleryGrid"></div>

  <!-- FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLfSyJTrfKJ11y0-OD-tqce51hAhB9ubk",
      authDomain: "artportfolio-7fb57.firebaseapp.com",
      projectId: "artportfolio-7fb57",
      storageBucket: "artportfolio-7fb57.firebasestorage.app",
      messagingSenderId: "221364362709",
      appId: "1:221364362709:web:4ad550bd8970302ef0715c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadGallery() {
      const gallery = document.getElementById("galleryGrid");
      const snapshot = await getDocs(collection(db, "ideas"));

      snapshot.forEach(doc => {
        const data = doc.data();

        const thumb = data.photos?.[0] || "https://via.placeholder.com/300x200?text=No+Image";

        const card = document.createElement("div");
        card.className = "project-card";

        card.innerHTML = `
          <img class="project-thumb" src="${thumb}">
          <div class="project-info">${data.title}</div>

          <div class="project-hover">
            <div><strong>Type:</strong> ${data.type?.join(", ") || "N/A"}</div>
            <div><strong>Materials:</strong> ${data.materials || "N/A"}</div>
            <div><strong>Difficulty:</strong> ${data.difficulty || "N/A"}</div>
          </div>
        `;

        gallery.appendChild(card);
      });
    }

    loadGallery();
  </script>

</body>
</html>
